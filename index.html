<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella Oracle - 極彩の占星術</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;600;900&display=swap');

        :root {
            --gold: #f3cf7a;
            --aurora-1: #4c1d95;
            --aurora-2: #1e3a8a;
            --aurora-3: #831843;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background: #030310;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        .cinzel { font-family: 'Cinzel', serif; }

        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #0a0a20 0%, #030310 100%);
            z-index: -2;
        }

        .aurora {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(76, 29, 149, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(131, 24, 67, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.3) 0%, transparent 50%);
            filter: blur(80px);
            animation: aurora-flow 30s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes aurora-flow {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(15deg) scale(1.1); }
        }

        .particle {
            position: fixed;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.5;
        }

        .oracle-card {
            background: rgba(15, 15, 35, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 0 40px rgba(131, 24, 67, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(243, 207, 122, 0.5), 0 0 30px rgba(131, 24, 67, 0.3);
        }

        label {
            color: #ffffff !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 900;
            letter-spacing: 0.2em;
        }

        select {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 2px solid rgba(243, 207, 122, 0.3) !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        select:focus {
            border-color: var(--gold) !important;
            background: rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 0 15px rgba(243, 207, 122, 0.3);
        }
        option { background: #1a1a3a; color: white; }

        .btn-divine {
            background: linear-gradient(135deg, #831843 0%, #4c1d95 50%, #1e3a8a 100%);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-divine::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: rotate-btn 4s linear infinite;
        }
        @keyframes rotate-btn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030310; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#831843, #4c1d95); border-radius: 10px; }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .zodiac-icon {
            filter: drop-shadow(0 0 10px rgba(243, 207, 122, 0.8));
            width: 100px; height: 100px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBVQjsgj4BcWYUWbGrFwc7DAmrkwdNzUIs",
            authDomain: "stella-oracle-app.firebaseapp.com",
            projectId: "stella-oracle-app",
            storageBucket: "stella-oracle-app.firebasestorage.app",
            messagingSenderId: "870745531911",
            appId: "1:870745531911:web:0adbeabbf1d56c7f9eaca2"
        };

        let auth, db;
        try {
            const app = firebase.apps.length === 0 ? firebase.initializeApp(firebaseConfig) : firebase.app();
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (err) {}

        const ZODIAC_SYMBOLS = {
            "牡羊座": "♈", "牡牛座": "♉", "双子座": "♊", "蟹座": "♋",
            "獅子座": "♌", "乙女座": "♍", "天秤座": "♎", "蠍座": "♏",
            "射手座": "♐", "山羊座": "♑", "水瓶座": "♒", "魚座": "♓"
        };

        const Particles = () => {
            const items = useMemo(() => Array.from({ length: 80 }).map(() => ({
                id: Math.random(),
                left: `${Math.random() * 100}%`,
                top: `${Math.random() * 100}%`,
                size: `${Math.random() * 3 + 1}px`,
                duration: `${Math.random() * 10 + 5}s`,
                delay: `${Math.random() * 5}s`
            })), []);
            return (
                <div className="fixed inset-0 pointer-events-none">
                    {items.map(p => (
                        <div key={p.id} className="particle animate-pulse" 
                             style={{ left: p.left, top: p.top, width: p.size, height: p.size, animationDuration: p.duration, animationDelay: p.delay }} />
                    ))}
                </div>
            );
        };

        const DatePicker = ({ label, date, setDate }) => {
            const years = Array.from({ length: 80 }, (_, i) => 2025 - i);
            const months = Array.from({ length: 12 }, (_, i) => i + 1);
            const days = Array.from({ length: 31 }, (_, i) => i + 1);

            return (
                <div className="space-y-4">
                    <label className="text-sm tracking-[0.3em] font-black uppercase text-white block">{label}</label>
                    <div className="grid grid-cols-3 gap-3">
                        <select value={date.year} onChange={e => setDate({...date, year: e.target.value})} className="p-4 rounded-xl">
                            <option value="">年</option>
                            {years.map(y => <option key={y} value={y}>{y}年</option>)}
                        </select>
                        <select value={date.month} onChange={e => setDate({...date, month: e.target.value})} className="p-4 rounded-xl">
                            <option value="">月</option>
                            {months.map(m => <option key={m} value={m}>{m}月</option>)}
                        </select>
                        <select value={date.day} onChange={e => setDate({...date, day: e.target.value})} className="p-4 rounded-xl">
                            <option value="">日</option>
                            {days.map(d => <option key={d} value={d}>{d}日</option>)}
                        </select>
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('input');
            const [mode, setMode] = useState('single');
            const [date1, setDate1] = useState({ year: '', month: '', day: '' });
            const [date2, setDate2] = useState({ year: '', month: '', day: '' });
            const [loading, setLoading] = useState(0);
            const [result, setResult] = useState(null);
            const [user, setUser] = useState(null);

            useEffect(() => {
                if (!auth) return;
                const login = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else { await auth.signInAnonymously(); }
                };
                login();
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            const getZodiac = (m, d) => {
                const month = parseInt(m);
                const day = parseInt(d);
                if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "牡羊座";
                if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "牡牛座";
                if ((month == 5 && day >= 21) || (month == 6 && day <= 21)) return "双子座";
                if ((month == 6 && day >= 22) || (month == 7 && day <= 22)) return "蟹座";
                if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "獅子座";
                if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "乙女座";
                if ((month == 9 && day >= 23) || (month == 10 && day <= 23)) return "天秤座";
                if ((month == 10 && day >= 24) || (month == 11 && day <= 22)) return "蠍座";
                if ((month == 11 && day >= 23) || (month == 12 && day <= 21)) return "射手座";
                if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "山羊座";
                if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "水瓶座";
                return "魚座";
            };

            const handleOracle = () => {
                setView('loading');
                let p = 0;
                const timer = setInterval(() => {
                    p += 2;
                    setLoading(p);
                    if (p >= 100) {
                        clearInterval(timer);
                        const s1 = getZodiac(date1.month, date1.day);
                        const s2 = mode === 'compatibility' ? getZodiac(date2.month, date2.day) : null;
                        
                        setResult({
                            sign1: s1, sign2: s2,
                            oracle: {
                                soul: "あなたの魂は、現在、宇宙の広大な知性とダイレクトに繋がるリンクを形成しています。これまでの経験はすべて、この瞬間にあなたが真の光を放つための準備でした。土星の重圧は消え去り、木星の恩恵があなたのオーラを包み込んでいます。今のあなたは、思考が現実化するスピードが極めて速くなっており、一瞬の直感が一生の運命を左右するほどの力を持っています。内なる静寂の中に、すべての答えが用意されています。あなたはただ、その声に耳を傾け、星々が描く航路に身を任せるだけで良いのです。過去の痛みは知恵へと昇華し、未来への不安は無限の可能性へと姿を変えています。",
                                fortune: "運命の歯車が大きく回転を始めました。特に人間関係や社会的地位において、予期せぬ扉が開かれるでしょう。これは偶然ではなく、あなたが長年積み上げてきた徳の報いです。金銭的な流れも浄化され、滞っていたエネルギーがスムーズに循環し始めます。迷った時は、常に『愛』に基づいた選択をしてください。そうすることで、宇宙はあなたに想像を超える豊かさを提供し続けるでしょう。",
                                daily: "日々の生活においては、色彩を意識することが運気をさらに高めます。特に藍色やゴールドを身近に置くことで、直感力が鋭敏になります。呼吸を整え、足の裏から大地のエネルギーを吸収し、頭頂部から宇宙の光を受け取るイメージを持ってください。あなたの存在そのものが、周囲を癒す聖域となるでしょう。",
                                // 個人鑑定用の拡張項目
                                mental: "精神の深淵において、あなたは極めて独自の美学と倫理観を育んでいます。表面的な喧騒に惑わされることなく、真理を追求するその姿勢は、銀河の星々が持つ秩序そのものです。あなたの内側には「聖域」が存在し、そこへ立ち戻るたびにエネルギーが再充填されます。この時期、自身の思考を言語化し、形を与えることで、内なる平和はより強固なものとなるでしょう。",
                                social: "社会という大きな天球儀の中で、あなたのポジションは「先導者」あるいは「賢者」へとシフトしています。人々はあなたの言葉に重みを感じ、あなたの行動に無意識の安心感を覚えています。リーダーシップを発揮する場面では、威圧ではなく『共感』を武器にしてください。それが結果的に、あなたの社会的評価を揺るぎないものとし、望んでいた高みへとあなたを押し上げる契機となります。",
                                love: "情愛の領域では、宇宙はあなたに「無条件の受容」というレッスンを提示しています。自らを愛し、許すことができた時、周囲からの愛もまた、遮られることなくあなたへと流れ込みます。特定のパートナーがいる場合は、言葉を超えた魂の対話を。いない場合は、自分自身との結婚を誓うような深い自己肯定を。愛は外から来るものではなく、あなたの内側から溢れ出し、世界を浸していくものです。",
                                key: "あなたが直面する試練は、実はあなたを制限するためのものではなく、あなたを「解放」するための仕掛けです。壁に見えるものは、実は次のステージへの扉です。困難を感じたときこそ、視点を銀河の彼方まで広げてください。小さなこだわりを捨て去った瞬間、重力から解き放たれたかのように、あなたの問題は自ずと解決へと向かいます。鍵は常に、あなたの掌の中にあります。"
                            },
                            comp: mode === 'compatibility' ? [
                                { title: "精神的共鳴度", val: "98%", desc: "二人の精神は同じ周波数で振動しています。初めて会った時から懐かしさを感じたのは、魂の記憶が共鳴しているからです。" },
                                { title: "宿命的引力", val: "85%", desc: "どんなに道が分かれても、最終的には一つの場所へ辿り着く強固な結びつきです。宇宙的な磁力が二人を常に引き寄せています。" },
                                { title: "現実の調和", val: "72%", desc: "価値観の違いさえも、お互いを補完するピースとなります。二人が協力すれば、不可能を可能にする奇跡を起こせるでしょう。" },
                                { title: "性的・本能的結合", val: "91%", desc: "理屈を超えた本能的なレベルで深く結びついています。触れ合うだけでエネルギーが循環し、癒しが起こります。" }
                            ] : null,
                            final: mode === 'compatibility' ? "二人の関係は、宇宙が織りなす最高傑作の一つです。信じる心を灯火に、共に果てなき旅路を歩んでください。" : "あなたは銀河に輝く唯一無二の宝石です。その輝きを信じ、光の差す方へ進んでください。"
                        });
                        setView('result');
                    }
                }, 40);
            };

            return (
                <div className="min-h-screen relative flex flex-col items-center justify-center p-6 pb-20">
                    <div className="cosmic-bg" />
                    <div className="aurora" />
                    <Particles />

                    <div className="w-full max-w-5xl z-10">
                        {view === 'input' && (
                            <div className="oracle-card p-10 md:p-20 rounded-[3rem] text-center fade-in">
                                <h1 className="cinzel text-5xl md:text-8xl mb-4 font-black tracking-widest glow-text bg-clip-text text-transparent bg-gradient-to-b from-white to-gold">STELLA ORACLE</h1>
                                <p className="text-pink-400 text-[10px] tracking-[1em] mb-16 uppercase font-bold italic">Chromatic Galactic Divination</p>

                                <div className="flex justify-center gap-10 mb-16">
                                    <button onClick={() => setMode('single')} className={`py-3 px-8 text-xs tracking-widest font-black transition-all rounded-full ${mode === 'single' ? 'bg-white text-indigo-900' : 'text-white/40 border border-white/10'}`}>鑑定</button>
                                    <button onClick={() => setMode('compatibility')} className={`py-3 px-8 text-xs tracking-widest font-black transition-all rounded-full ${mode === 'compatibility' ? 'bg-white text-indigo-900' : 'text-white/40 border border-white/10'}`}>相性</button>
                                </div>

                                <div className="max-w-md mx-auto space-y-12">
                                    <DatePicker label="汝の生年月日" date={date1} setDate={setDate1} />
                                    {mode === 'compatibility' && <div className="fade-in pt-4"><DatePicker label="相手の生年月日" date={date2} setDate={setDate2} /></div>}
                                    
                                    <button onClick={handleOracle} 
                                            disabled={!date1.year || (mode==='compatibility' && !date2.year)}
                                            className="btn-divine w-full py-8 mt-12 rounded-2xl shadow-[0_0_40px_rgba(76,29,149,0.5)] transition-all transform hover:scale-105 active:scale-95 disabled:opacity-20 disabled:scale-100">
                                        <span className="relative z-10 text-white font-black tracking-[1em] cinzel text-lg">INVOKE FATE</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'loading' && (
                            <div className="text-center fade-in">
                                <div className="relative w-64 h-64 mx-auto mb-10">
                                    <svg className="w-full h-full transform -rotate-90">
                                        <circle cx="128" cy="128" r="120" stroke="rgba(255,255,255,0.05)" strokeWidth="4" fill="transparent" />
                                        <circle cx="128" cy="128" r="120" stroke="url(#gradient)" strokeWidth="4" fill="transparent" 
                                                strokeDasharray={754} strokeDashoffset={754 - (754 * loading / 100)} className="transition-all duration-300" />
                                        <defs>
                                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" stopColor="#831843" />
                                                <stop offset="100%" stopColor="#4c1d95" />
                                            </linearGradient>
                                        </defs>
                                    </svg>
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <span className="cinzel text-4xl font-black text-white glow-text">{loading}%</span>
                                    </div>
                                </div>
                                <p className="text-gold/60 tracking-[1.5em] text-xs uppercase animate-pulse">Reading the celestial script...</p>
                            </div>
                        )}

                        {view === 'result' && result && (
                            <div className="fade-in space-y-10">
                                <div className="oracle-card p-10 md:p-20 rounded-[4rem]">
                                    <div className="flex flex-col md:flex-row items-center justify-around gap-12 mb-24">
                                        <div className="text-center group">
                                            <div className="text-8xl mb-4 zodiac-icon">{ZODIAC_SYMBOLS[result.sign1]}</div>
                                            <div className="text-gold tracking-[0.4em] font-black text-xl mb-1">{result.sign1}</div>
                                            <div className="cinzel text-[10px] text-white/40 tracking-[0.5em]">{mode === 'single' ? 'THE ORIGIN' : 'THE ORIGIN'}</div>
                                        </div>
                                        {mode === 'compatibility' && (
                                            <>
                                                <div className="text-6xl text-white/10 cinzel font-thin animate-bounce">❤</div>
                                                <div className="text-center group">
                                                    <div className="text-8xl mb-4 zodiac-icon">{ZODIAC_SYMBOLS[result.sign2]}</div>
                                                    <div className="text-gold tracking-[0.4em] font-black text-xl mb-1">{result.sign2}</div>
                                                    <div className="cinzel text-[10px] text-white/40 tracking-[0.5em]">THE PARTNER</div>
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    <div className="space-y-16">
                                        <section className="bg-white/5 p-10 rounded-[3rem] border border-white/10">
                                            <h3 className="cinzel text-pink-400 text-xs tracking-[0.8em] font-black mb-10 text-center uppercase">I. 魂の深層神託</h3>
                                            <p className="text-lg md:text-2xl text-white/90 leading-[2.4] tracking-widest text-justify font-light">
                                                {result.oracle.soul}
                                            </p>
                                        </section>

                                        {/* 共通の項目 */}
                                        <div className="grid md:grid-cols-2 gap-10">
                                            <div className="bg-indigo-900/30 p-12 rounded-[2rem] border border-indigo-500/20">
                                                <h4 className="cinzel text-indigo-300 text-[10px] tracking-widest mb-6 font-black uppercase">II. 宿命の転換</h4>
                                                <p className="text-sm text-indigo-100/70 leading-relaxed tracking-widest italic">{result.oracle.fortune}</p>
                                            </div>
                                            <div className="bg-purple-900/30 p-12 rounded-[2rem] border border-purple-500/20">
                                                <h4 className="cinzel text-purple-300 text-[10px] tracking-widest mb-6 font-black uppercase">III. 日常の調律</h4>
                                                <p className="text-sm text-purple-100/70 leading-relaxed tracking-widest italic">{result.oracle.daily}</p>
                                            </div>
                                        </div>

                                        {/* シングルモード限定：詳細項目 */}
                                        {mode === 'single' && (
                                            <div className="space-y-10 fade-in">
                                                <div className="grid md:grid-cols-2 gap-10">
                                                    <div className="bg-white/5 p-12 rounded-[2rem] border border-white/5">
                                                        <h4 className="cinzel text-blue-300 text-[10px] tracking-widest mb-6 font-black uppercase">IV. 深層の精神構造</h4>
                                                        <p className="text-sm text-white/70 leading-relaxed tracking-widest">{result.oracle.mental}</p>
                                                    </div>
                                                    <div className="bg-white/5 p-12 rounded-[2rem] border border-white/5">
                                                        <h4 className="cinzel text-emerald-300 text-[10px] tracking-widest mb-6 font-black uppercase">V. 社会的到達点</h4>
                                                        <p className="text-sm text-white/70 leading-relaxed tracking-widest">{result.oracle.social}</p>
                                                    </div>
                                                </div>
                                                <div className="grid md:grid-cols-2 gap-10">
                                                    <div className="bg-white/5 p-12 rounded-[2rem] border border-white/5">
                                                        <h4 className="cinzel text-rose-300 text-[10px] tracking-widest mb-6 font-black uppercase">VI. 愛と調和の誓約</h4>
                                                        <p className="text-sm text-white/70 leading-relaxed tracking-widest">{result.oracle.love}</p>
                                                    </div>
                                                    <div className="bg-white/5 p-12 rounded-[2rem] border border-white/5">
                                                        <h4 className="cinzel text-amber-300 text-[10px] tracking-widest mb-6 font-black uppercase">VII. 試練と克服の鍵</h4>
                                                        <p className="text-sm text-white/70 leading-relaxed tracking-widest">{result.oracle.key}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* 相性モード限定：四層分析 */}
                                        {mode === 'compatibility' && (
                                            <div className="space-y-10">
                                                <h3 className="cinzel text-gold text-xs tracking-[1em] font-black text-center uppercase">IV. 魂の共鳴・四層分析</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    {result.comp.map((c, i) => (
                                                        <div key={i} className="bg-white/5 p-8 rounded-2xl border border-white/5 hover:border-gold/30 transition-all">
                                                            <div className="flex justify-between items-end mb-4">
                                                                <span className="text-[10px] text-white/40 font-black tracking-widest">{c.title}</span>
                                                                <span className="cinzel text-3xl text-gold font-black">{c.val}</span>
                                                            </div>
                                                            <div className="w-full bg-white/5 h-1 rounded-full mb-6 overflow-hidden">
                                                                <div className="h-full bg-gradient-to-r from-pink-500 to-indigo-500" style={{width: c.val}} />
                                                            </div>
                                                            <p className="text-xs text-white/60 leading-relaxed">{c.desc}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <div className="text-center pt-20 border-t border-white/10">
                                            <p className="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-gold via-white to-gold leading-relaxed mb-16 px-4">
                                                「{result.final}」
                                            </p>
                                            <button onClick={() => { window.scrollTo(0,0); setView('input'); }} 
                                                    className="cinzel text-[10px] tracking-[1.5em] text-white/20 hover:text-white transition-all uppercase">
                                                ― REAWAKEN THE STARS ―
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
