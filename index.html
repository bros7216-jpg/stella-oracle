<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella Oracle - 極致の占星術</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@300;600&display=swap');

        :root {
            --cosmic-deep: #02020a;
            --gold-accent: #d4af37;
            --gold-bright: #f8f1d9;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--cosmic-deep);
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }

        .cinzel { font-family: 'Cinzel', serif; }

        /* 背景アニメーション */
        .nebula-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(76, 29, 149, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(30, 58, 138, 0.4) 0%, transparent 50%);
            z-index: -1;
            filter: blur(60px);
            animation: nebulaMove 20s infinite alternate ease-in-out;
        }

        @keyframes nebulaMove {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .stars-container {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: starTwinkle var(--duration) infinite var(--delay);
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .oracle-card {
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }

        .ritual-circle {
            width: 220px; height: 220px;
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 1.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--gold-accent); }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>

        const ZODIAC_DATA = [
            { sign: '牡羊座', dates: '3.21 - 4.19', element: '火', 
              basic: '牡羊座のあなたは、宇宙の巨大な歯車が再び回り出す瞬間の、純粋かつ圧倒的な推進力そのものです。何者にも依存せず、自らの直感だけを羅針盤として荒野を突き進む姿は、停滞した世界に「生命の鼓動」を再注入する役割を担っています。周囲が躊躇う深淵を跳び越え、まだ誰も名付けていない地平に一番乗りする喜び。その燃え盛る魂は、挫折さえも次の飛躍のための薪（まき）に変えてしまう強靭さを秘めています。あなたは、運命に支配される者ではなく、自らの意志で運命を彫り刻む開拓者なのです。', 
              love: '愛においてあなたは、一切の駆け引きを拒絶する「純白の情熱」を捧げます。好きになった瞬間に世界はその人を中心に回り始め、魂の全存在をかけて相手を守り、慈しもうとします。その直球すぎる愛は時に相手を圧倒しますが、あなたの無垢な真心に触れた者は、二度と他の冷めた関係には満足できなくなるでしょう。', 
              work: 'ゼロからイチを創り出す、あるいは前人未到のプロジェクトを牽引する際に比類なき才能を発揮します。既存のルールに従うよりも、自らルールを創る立場に置かれたとき、あなたのパフォーマンスは極限に達します。瞬発力と勇気が必要な場面において、あなたは組織の救世主となるはずです。', 
              advice: '燃え盛る炎は、時に自分自身をも焼き尽くしかねません。静寂という名の冷たい水で心を潤し、深呼吸の中に「未来の戦略」を忍ばせる知恵を持つことで、あなたの覇道はより確固たるものになるでしょう。' },
            { sign: '牡牛座', dates: '4.20 - 5.20', element: '地', 
              basic: '牡牛座のあなたは、豊かな大地が何千年もかけて宝石を育むような、重厚で確実な時間の守護者です。流行に流されず、自分にとっての「本物」を見極める審美眼は、神から与えられた聖なる才能。五感を通じて世界の美を味わい尽くし、それを形ある「価値」へと変えていく粘り強さは、12星座の中で最も信頼に足るものです。一歩一歩が地を踏みしめる音は、周囲に揺るぎない安心感を与え、あなたが築き上げた城は、決して崩れることのない繁栄の象徴となります。時間を味方につけたとき、あなたは無敵の存在へと昇華します。',

              advice: '執着は時として、あなたの翼を重くし、飛翔を妨げます。古い皮を脱ぎ捨てるヘビのように、過去の成功や所有物を手放す勇気を持つことで、より巨大な豊かさがあなたの手のひらに流れ込むようになります。' },
            { sign: '双子座', dates: '5.21 - 6.21', element: '風', 
              basic: '双子座のあなたは、宇宙を駆け巡る光の粒子であり、情報を媒介する知性のメッセンジャーです。一つの場所、一つの考えに留まることを魂が拒み、常に「まだ見ぬ隣の景色」を求めて意識を拡張し続けます。あなたの二面性は、決して矛盾ではなく、多次元的な視点を同時に持つという高度な知性の現れです。軽やかな会話術で複雑な事象を解きほぐし、人と人を瞬時に繋ぎ合わせる魔法のような力。あなたが通り過ぎた後には、必ず新しい知識の種が蒔かれ、世界はそれまでよりも少しだけ明るく、そして知的になります。', 
              love: '愛における至上の喜びは、魂を震わせる「対話」の中にあります。肉体的な接触以上に、言葉と情報のキャッチボールで知的な絶頂を感じるタイプ。束縛は死を意味し、自由な翼を許容してくれるパートナーとの間で、火花が散るような刺激に満ちた、飽きることのない関係を生涯楽しみ続けます。',

              advice: '好奇心という名の風は、あなたをどこまでも遠くへ運びますが、時には一つの深淵を深く覗き込むことでしか得られない「真理」があります。情報の量ではなく、その背後にある「重み」を感じ取ったとき、あなたの知性は神の領域へと近づきます。' },
            { sign: '蟹座', dates: '6.22 - 7.22', element: '水', 
              basic: '蟹座のあなたは、月の重力に導かれる潮汐（ちょうせき）のように、人々の感情を静かに、しかし強力に動かす「慈愛の源泉」です。冷たい外の世界から大切な人々を守るために築かれたあなたの「殻」の中には、宇宙で最も温かく、豊かな感受性の海が広がっています。他者の心の微かな揺れを、自分の痛みとして感じ取る共感能力は、傷ついた魂を癒やす聖なる力。あなたは、居場所のない者に「家」を与え、孤独な者に「繋がり」を感じさせる、この冷酷な世界における唯一の避難所であり、愛の守護者なのです。', 
              love: '愛とは無条件の奉仕であり、相手と一体化するほどの深い融合です。あなたはパートナーのために自己を犠牲にすることを厭わず、至れり尽くせりの愛情を注ぎます。あなたの愛に触れた者は、母親の胎内にいたときのような究極の安心感を覚え、その献身に心から膝を屈することになるでしょう。', 
              work: '人の育成、ケア、生活に密着したビジネス、あるいはコミュニティ運営においてカリスマ的な才能を発揮します。数値やデータではなく、「心」で動く現場において、あなたの直感と包容力は最強のマネジメントツールとなります。あなたがリーダーになれば、そこは単なる組織ではなく「家族」となります。', 
              advice: '他人の感情を吸い込みすぎると、あなた自身の魂が溺れてしまいます。自分の心を守るための防波堤をしっかりと築き、他人の重荷ではなく、自分自身の幸せのためにそのエネルギーを使う許可を自分に出してあげてください。' },
            { sign: '獅子座', dates: '7.23 - 8.22', element: '火', 
              basic: '獅子座のあなたは、暗闇を切り裂く真昼の太陽であり、天性の輝きを放つ王者の魂を持っています。あなたがその場に現れるだけで空気が華やぎ、人々の視線が自然と集まるのは、前世から受け継いだ高貴なカリスマの証。自らの人生という舞台で、主演・監督・脚本のすべてをこなし、ドラマチックな展開を自ら創り出す創造性は、他者に生きる喜びと勇気を与えます。誇り高く、気高く、そして子供のような無垢な遊び心を持ち続けるあなた。その存在そのものが、世界に対する力強い「肯定」であり、最高のエンターテインメントなのです。', 
              love: '愛においてあなたは、最も贅沢で、最も情熱的な演出家となります。愛する人に最高の自分を見せ、相手を世界で一番幸せな主役にしようと努めます。その誇り高き愛は時に独占欲として現れますが、それは相手を自分の一部として深く尊重しているからこそ。あなたは愛の力で相手を「光の騎士」や「王妃」に変えてしまう魔法使いです。', 
              work: '経営、舞台、企画、あるいは自らの名前がブランドになるような仕事でこそ真価を発揮します。誰かの下で働くよりも、自らが旗振り役となり、周囲の熱量を高めていく役割が最適。賞賛こそがあなたの最大のエネルギー源であり、喝采を浴びるほどにあなたの才能は無限に拡大していきます。', 
              advice: '真の王者は、孤独を知る者です。周囲の評価という鏡に頼らず、誰も見ていないところでも自分を誇れる「内なる尊厳」を育ててください。あなたの光が内側から満ち溢れたとき、それはもはや何者にも消せない永遠の太陽となります。' },
            { sign: '乙女座', dates: '8.23 - 9.22', element: '地',

              work: '医療、編集、分析、精密機器、あるいは高度な管理業務。1ミリの誤差も許されない状況下で、あなたの冷静さと正確さは神話的な信頼を勝ち取ります。あなたが「YES」と言えば、それは世界で最も確実な保証。プロフェッショナルとしての誇りが、あなたのキャリアを類稀なる高みへと押し上げるでしょう。', 
              advice: '完璧主義は、時にあなた自身を追い詰める毒となります。不完全なもの、歪んだものの中にある美しさを見つけ、そこに「余白」を許すことで、あなたの人生はより豊かで、血の通った温かな物語へと進化していきます。' },
            { sign: '天秤座', dates: '9.23 - 10.23', element: '風',

              love: '愛とは、二人の魂が織りなす極上の社交。激しすぎる感情の爆発を避け、常に理性的で美しい関係を求めます。相手の長所を誰よりも早く見抜き、それを洗練された言葉で称賛するあなたは、最高のパートナー。二人で築く生活は、洗練されたインテリアのように調和が取れ、周囲から羨望の眼差しを浴びる理想的なものになるでしょう。', 
              work: 'デザイン、法律、広報、ファッション、あるいは仲介交渉。美意識と公正さが求められる場面で、あなたの右に出る者はいません。客観的な視点を保ちつつ、関係者全員が納得する「美しい着地点」を見出す能力は、現代の複雑な社会において平和を維持するための必須スキルです。', 
              advice: '他人の顔色を伺い、調和を優先するあまり、自分自身の「本音」を置き去りにしていませんか？ 誰にも嫌われないための選択ではなく、自分が心から愛せる「一点」のために、時にはバランスを崩してでも深く踏み込む勇気を持ってください。' },
            { sign: '蠍座', dates: '10.24 - 11.22', element: '水', 
              basic: '蠍座のあなたは、深淵の底に眠る真実の火を守る「神秘の司祭」です。表面的な欺瞞や社交辞令を、その冷徹かつ鋭い洞察力で一瞬にして見抜き、物事の核心へと直行します。あなたのエネルギーは12星座で最も凝縮されており、一度狙いを定めた対象には、魂の全存在をかけて取り組む爆発的な集中力を持っています。死と再生、絶望と救済。極限状態においてこそ、あなたの真の力は解放され、ボロボロになった現状から不死鳥のように新しい生命を産み落とすことができるのです。あなたの沈黙は、雄弁な言葉よりも多くの真実を語ります。', 
              love: '愛とは、魂の完全な融合であり、命がけの契約です。蠍座の愛に「適当」という言葉はありません。相手のすべてを所有し、同時に自分のすべてを捧げる、究極の絆を求めます。その深い愛情は時に激しい嫉妬や執着に変わりますが、それは相手を宇宙で唯一無二の存在として認めている証。あなたの愛を一度受けた者は、他のどんな愛も薄っぺらに感じてしまうでしょう。',

            { sign: '射手座', dates: '11.23 - 12.21', element: '火',

            { sign: '山羊座', dates: '12.22 - 1.19', element: '地', 
              basic: '山羊座のあなたは、峻険な氷の山を、一歩ずつ、しかし確実に登り続ける「静かなる覇者」です。時間と努力を最大の味方につけ、誰もが不可能と思うような堅固な成果を築き上げるその姿は、社会を支える最後にして最強の砦。あなたの野心は、一時的な名声のためではなく、永遠に残る「秩序」と「伝統」を創り出すためのものです。感情に流されず、冷静に状況を分析し、最適かつ最短のルートを選び取る冷徹なまでのプロ意識。あなたが頂上に立ったとき、その景色はそれまでのすべての苦労を正当化するほどの、圧倒的な栄光に満ち溢れているはずです。', 
              love: '愛とは、責任と信頼に基づく強固な契約。一時の情熱よりも、10年後、20年後も隣で笑っていられる安定感を重視します。不器用で言葉足らずな面もありますが、行動で示す誠実さは12星座随一。あなたが一度愛した者は、あなたの提供する絶対的な安全地帯の中で、心から守られている実感を噛みしめることになります。', 
              work: '経営、政治、不動産、管理職、あるいは伝統芸能。組織を統率し、ルールを作り、結果を出し続ける立場において、あなたの右に出る者はいません。困難であればあるほどあなたの闘志は静かに燃え上がり、最終的には必ず「勝者」として歴史に名を刻むことでしょう。', 
              advice: '「役に立たなければ価値がない」という強迫観念を捨ててください。何も生み出さない、ただのあなた自身にも、宇宙的な価値があるのです。時には重い荷物を下ろし、無邪気に笑う時間を自分に許すことで、山登りはもっと楽しいものになります。' },
            { sign: '水瓶座', dates: '1.20 - 2.18', element: '風', 
              basic: '水瓶座のあなたは、未来から誤ってこの時代に送り込まれた、孤独な革新者にして友愛の伝道師です。常識という名の古い衣を脱ぎ捨て、誰もが平等に、かつ個性的に生きられる理想郷（エデン）を夢想しています。あなたの独創性は、時に周囲に「変人」というレッテルを貼らせますが、それはあなたが時代を先取りしすぎている証拠。国境、人種、性別といった一切の境界線を無効化し、魂という共通言語で世界を繋ごうとするあなたの視座は、神の視点に近いものです。あなたは、停滞した人類の意識を強制的にアップデートする「閃光」そのものです。', 
              love: '愛におけるキーワードは「最高の友人」であること。嫉妬や独占欲といったドロドロした感情を嫌い、知的な共感と自立した個性を尊重し合える関係を築きます。あなたの愛は宇宙のように広大ですが、特定の誰かに対する「執着」は薄め。しかし、一度魂の波長が合った相手とは、時空を超えた深い精神的絆で結ばれ続けるでしょう。', 
              work: 'IT、宇宙開発、NGO、アート、発明、占星術。まだ定義されていない新しいジャンルを切り拓くことが得意です。誰かの真似をすることを魂が拒絶するため、唯一無二のポジションを築くことになります。あなたの独創的なアイデアは、社会の古いシステムを破壊し、より合理的な未来へと導く楔（くさび）となります。', 
              advice: '理屈は正しいですが、人間の心は必ずしも理屈で動くものではありません。他者の「感情的な弱さ」を切り捨てず、あえて非合理な感情の渦に足を踏み入れることで、あなたの理想はより多くの人々に届く、真の救いへと変わっていきます。' },
            { sign: '魚座', dates: '2.19 - 3.20', element: '水', 
              basic: '魚座のあなたは、12星座のすべての経験を内包し、最後にすべてを許し、溶け合わせる「宇宙の調和者」です。この物理的な世界のルールよりも、夢、幻想、芸術、そして愛という目に見えない世界のリアリティを深く信じています。境界線を持たないあなたの魂は、他者の悲しみも世界の痛みもすべて自分のこととして受け入れ、慈愛の涙で浄化してしまいます。現実離れしたその危うさは、この殺伐とした世界における唯一の「救い」であり、人々に「目に見えない豊かさ」を思い出させる、地上に降り立った天使のような存在なのです。', 
              love: '愛とは、自分を消して相手と溶け合う神秘体験。あなたは愛する人のためなら、自分のアイデンティティさえも捧げ、相手の色に染まることを厭いません。その無私無欲の愛は、受ける側に「神の救済」を感じさせますが、同時にあなたなしでは生きていけないという強烈な陶酔感を与えます。あなたの愛は、魂の傷を癒やす究極の聖水です。', 
              work: '芸術、カウンセリング、ヒーリング、福祉、あるいはスピリチュアルな分野。直感だけで物事の本質を掴み取る能力は、論理的な努力を嘲笑うほどの的中率を誇ります。あなたが関わる仕事には、必ず「祈り」に似た深みが宿り、触れる人々の心を激しく揺さぶり、深い感動を与えることでしょう。', 
              advice: '他人のために自分を使い果たさないでください。NOと言えない優しさは、時に自分自身を迷子にさせます。一日のうちの数時間だけでも、世俗のノイズを完全に遮断する時間を持ち、自分の魂の輪郭を確かめる「聖なる孤独」を大切にしてください。' }
        ];

        const COMP_RESULTS = {
            '火-火': { score: 91, title: '天をも焦がす双生の劫火', bond: '二つの情熱が重なり合い、単なる足し算ではなく乗算のエネルギーを生み出す組み合わせです。', mental: '言葉を尽くさずとも、瞬時に相手の意図を汲み取り、同じ未来のヴィジョンを共有できます。', action: '二人が揃えば、不可能と思われた壁も瞬時に突破し、周囲を巻き込む熱狂的な渦を創り出すでしょう。', trial: '双方が「自分が主導権を握りたい」と願うため、一歩も譲らない衝突が起きたときは宇宙規模の爆発になります。', oracle: '競い合うのではなく、お互いの背中を守る「戦友」としての意識が、関係を永遠のものにします。' },
            '地-地': { score: 98, title: '永遠不滅を誓いし大地の結晶', bond: '12星座の組み合わせの中で、最も盤石で、最も繁栄を約束された至高のペアリングです。', mental: '価値観の根底が一致しており、無言で過ごす時間さえも、魂を充填する至福の安らぎとなります。', action: '確実に資産を築き、最高に洗練された生活環境を作り上げ、周囲に羨望される「理想の家庭・組織」を構築します。', trial: '安定を求めるあまり変化を恐れ、外の世界の風を遮断してしまう「閉鎖性」にだけは注意が必要です。', oracle: '時折、予定外の旅に出るなどの「揺らぎ」を取り入れることで、二人の絆はより生命力に満ちたものになります。' },
            '風-風': { score: 94, title: '銀河を駆け抜ける知性の舞踏', bond: '重力から解放された二つの知性が、情報の宇宙を自由に駆け巡るような軽やかで美しい関係です。', mental: '最新のトピック、哲学的な議論、皮肉の効いたユーモア。会話を交わすたびに、二人の知能指数は高まり続けます。', action: '形に囚われない自由なパートナーシップを築き、古い常識に縛られている人々を驚かせるような革新的な生き方を提示します。', trial: '感情的な泥臭いやり取りを避ける傾向があるため、本当に辛いときに「弱さ」を出し合う練習が必要です。', oracle: '言葉の裏側にある「震える心」を、論理ではなく直感で抱きしめる勇気を持ってください。' },
            '水-水': { score: 96, title: '聖なる深淵にて溶け合う魂の原液', bond: '肉体の境界線さえも曖昧になり、一つの巨大な感情の海に回帰していくような、神秘的で深い融合です。', mental: '一人が悲しめばもう一人も涙し、一人が喜べばもう一人も満たされる。究極の共感と、慈愛のループ。', action: '世俗的な成功よりも、二人の心の平安と精神的な豊かさを最優先し、愛に満ちた美しい聖域を守り抜きます。', trial: 'お互いの感情に飲み込まれ、現実的な問題（経済や健康管理）を放置して共倒れにならないよう自制心が必要です。', oracle: '海から陸へ上がる時間を持つように、時には現実のルールを意識することが、二人の愛を長続きさせます。' },
            'default': { score: 78, title: '異質なる旋律が織りなす新世界', bond: '全く異なる性質が出会うことで、自分の中には存在しなかった「未知の可能性」を補完し合う教育的な絆です。', mental: '理解できない部分を「不快」ではなく「神秘」として捉え直したとき、二人の関係は劇的に進化します。', action: '一人が夢を描き、もう一人がそれを形にする。異なる才能をパズルのように組み合わせ、奇跡を起こします。', trial: '「自分の常識は相手の非常識」であることを肝に銘じ、徹底的な対話と歩み寄りを怠らないことが不可欠です。', oracle: '違いを埋めるのではなく、その「溝」に咲く珍しい花を二人で愛でる余裕を持ってください。' }
        };

        const StarField = () => {
            const stars = useMemo(() => [...Array(150)].map((_, i) => ({
                id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`,

        };

        function App() {
            const [view, setView] = useState('input');
            const [mode, setMode] = useState('individual');
            const [data, setData] = useState({ m1: '', d1: '', m2: '', d2: '' });
            const [loading, setLoading] = useState(0);
            const [result, setResult] = useState(null);

            const getZodiac = (m, d) => {
                const mm = parseInt(m); const dd = parseInt(d);
                if (!mm || !dd) return null;
                if ((mm === 3 && dd >= 21) || (mm === 4 && dd <= 19)) return '牡羊座';
                if ((mm === 4 && dd >= 20) || (mm === 5 && dd <= 20)) return '牡牛座';
                if ((mm === 5 && dd >= 21) || (mm === 6 && dd <= 21)) return '双子座';
                if ((mm === 6 && dd >= 22) || (mm === 7 && dd <= 22)) return '蟹座';
                if ((mm === 7 && dd >= 23) || (mm === 8 && dd <= 22)) return '獅子座';
                if ((mm === 8 && dd >= 23) || (mm === 9 && dd <= 22)) return '乙女座';
                if ((mm === 9 && dd >= 23) || (mm === 10 && dd <= 23)) return '天秤座';
                if ((mm === 10 && dd >= 24) || (mm === 11 && dd <= 22)) return '蠍座';
                if ((mm === 11 && dd >= 23) || (mm === 12 && dd <= 21)) return '射手座';
                if ((mm === 12 && dd >= 22) || (mm === 1 && dd <= 19)) return '山羊座';
                if ((mm === 1 && dd >= 20) || (mm === 2 && dd <= 18)) return '水瓶座';

                return null;
            };

            const runOracle = () => {
                if (!data.m1 || !data.d1) return;
                if (mode === 'compatibility' && (!data.m2 || !data.d2)) return;

                setView('loading');
                let progress = 0;
                const timer = setInterval(() => {

                    setLoading(progress);
                    if (progress >= 100) {
                        clearInterval(timer);
                        const s1 = ZODIAC_DATA.find(z => z.sign === getZodiac(data.m1, data.d1));

                        let comp = null;
                        if (mode === 'compatibility') {
                            s2 = ZODIAC_DATA.find(z => z.sign === getZodiac(data.m2, data.d2));

                            comp = COMP_RESULTS[key] || COMP_RESULTS['default'];
                        }
                        setResult({ s1, s2, comp });
                        setView('result');
                    }
                }, 40);
            };

            return (
                <div className="min-h-screen relative flex items-center justify-center p-4">
                    <div className="nebula-bg"></div>
                    <StarField />

                    <div className="w-full max-w-4xl z-10">
                        {view === 'input' && (

                                            <div className="flex-1 relative">

                                                <span className="absolute bottom-1 right-2 text-[10px] text-gold-accent/40">DAY</span>
                                            </div>
                                        </div>
                                    </div>

                                    {mode === 'compatibility' && (
                                        <div className="space-y-4 fade-in">
                                            <p className="text-[10px] text-gold-accent tracking-[0.4em] font-bold uppercase">第二の魂の生誕日</p>
                                            <div className="flex gap-6">
                                                <div className="flex-1 relative">
                                                    <input type="number" placeholder="月" value={data.m2} onChange={e=>setData({...data, m2:e.target.value})} className="w-full bg-white/5 border-b-2 border-gold-accent/30 p-4 text-2xl text-center text-white outline-none focus:border-gold-accent transition-colors" />
                                                    <span className="absolute bottom-1 right-2 text-[10px] text-gold-accent/40">MONTH</span>

                                                <div className="flex-1 relative">
                                                    <input type="number" placeholder="日" value={data.d2} onChange={e=>setData({...data, d2:e.target.value})} className="w-full bg-white/5 border-b-2 border-gold-accent/30 p-4 text-2xl text-center text-white outline-none focus:border-gold-accent transition-colors" />

                        )}

                        {view === 'loading' && (
                            <div className="text-center fade-in">
                                <div className="flex justify-center mb-10">
                                    <div className="ritual-circle flex items-center justify-center">
                                        <div className="text-gold-accent cinzel text-3xl font-bold glow-text">{loading}%</div>
                                    </div>
                                </div>
                                <p className="text-gold-accent text-sm tracking-[0.5em] animate-pulse">READING ASTROLOGICAL ALIGNMENT...</p>
                            </div>
                        )}

                        {view === 'result' && result && (
                            <div className="fade-in space-y-12 max-h-[92vh] overflow-y-auto pb-16 pr-4 custom-scroll">
                                {/* 個人鑑定セクション */}
                                <div className="oracle-card p-10 md:p-16 rounded-[4rem]">
                                    <div className="flex flex-col md:flex-row gap-12 items-start">
                                        <div className="w-full md:w-1/3 text-center sticky top-0">
                                            <ZodiacIcon name={result.s1.sign} className="w-48 h-48 text-gold-accent mx-auto mb-8 filter drop-shadow-[0_0_15px_rgba(212,175,55,0.3)]" />
                                            <h2 className="text-5xl font-bold text-gold-accent mb-4 glow-text">{result.s1.sign}</h2>
                                            <p className="text-sm text-gold-accent/50 cinzel tracking-widest mb-10">{result.s1.dates}</p>
                                            <div className="inline-block px-4 py-1 border border-gold-accent/30 rounded-full text-[10px] tracking-widest text-gold-accent/60">
                                                ELEMENT: {result.s1.element}
                                            </div>
                                        </div>
                                        
                                        <div className="w-full md:w-2/3 space-y-12">
                                            <section>
                                                <h3 className="text-gold-accent text-xs font-bold tracking-[0.4em] mb-6 border-l-4 border-gold-accent pl-5 uppercase">宿命の本質的刻印</h3>
                                                <p className="leading-[2.2] text-indigo-50/90 text-[15px] text-justify">{result.s1.basic}</p>
                                            </section>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                <div className="p-8 rounded-3xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
                                                    <h4 className="text-[#ff69b4] text-[10px] font-bold tracking-[0.3em] uppercase mb-4">愛の福音と魂の引力</h4>
                                                    <p className="text-sm leading-[1.8] text-indigo-100/70">{result.s1.love}</p>
                                                </div>
                                                <div className="p-8 rounded-3xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
                                                    <h4 className="text-[#00f7ff] text-[10px] font-bold tracking-[0.3em] uppercase mb-4">天命としての職能</h4>
                                                    <p className="text-sm leading-[1.8] text-indigo-100/70">{result.s1.work}</p>
                                                </div>
                                            </div>

                                            <div className="p-8 rounded-3xl bg-gradient-to-br from-gold-accent/10 to-transparent border border-gold-accent/20">
                                                <p className="text-lg italic font-medium text-gold-accent/90 leading-relaxed text-center">
                                                    「 {result.s1.advice} 」
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 相性鑑定セクション */}
                                {mode === 'compatibility' && result.s2 && (
                                    <div className="oracle-card p-12 md:p-20 rounded-[4rem] bg-gradient-to-b from-[#0a051a] to-black border-t-2 border-gold-accent/40">
                                        <div className="text-center mb-16">
                                            <p className="text-[10px] text-gold-accent/40 tracking-[0.8em] font-bold mb-8 uppercase">Celestial Compatibility</p>
                                            <div className="flex justify-center items-center gap-10 mb-10">
                                                <div className="text-center">
                                                    <ZodiacIcon name={result.s1.sign} className="w-16 h-16 text-gold-accent/40 mb-2" />
                                                    <span className="text-[10px] text-gold-accent/60">{result.s1.sign}</span>
                                                </div>
                                                <div className="relative">
                                                    <div className="cinzel text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#ff0080] to-[#7928ca] glow-text">{result.comp.score}</div>
                                                    <span className="absolute -top-2 -right-4 text-white/40 cinzel text-xl">%</span>
                                                </div>
                                                <div className="text-center">
                                                    <ZodiacIcon name={result.s2.sign} className="w-16 h-16 text-gold-accent/40 mb-2" />
                                                    <span className="text-[10px] text-gold-accent/60">{result.s2.sign}</span>
                                                </div>
                                            </div>
                                            <h2 className="text-2xl md:text-4xl font-bold text-white tracking-[0.2em] mb-4">「 {result.comp.title} 」</h2>
                                        </div>

                                        <div className="max-w-3xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-12">
                                            {[
                                                { t: '宿命の絆（Karmic Bond）', c: result.comp.bond },
                                                { t: '精神的共鳴（Mental Echo）', c: result.comp.mental },
                                                { t: '現実的調和（Physical Flow）', c: result.comp.action },
                                                { t: '不和の克服（Trial & Error）', c: result.comp.trial },
                                            ].map((s, i) => (
                                                <div key={i} className="space-y-4">
                                                    <h4 className="text-gold-accent/70 text-[11px] tracking-[0.3em] font-bold uppercase border-b border-gold-accent/20 pb-2">{s.t}</h4>
                                                    <p className="text-[13px] leading-[2] text-indigo-50/70 text-justify">{s.c}</p>
                                                </div>
                                            ))}
                                            <div className="md:col-span-2 mt-8 p-10 bg-white/5 rounded-[2rem] border border-white/5 text-center">
                                                <h4 className="text-gold-accent text-xs tracking-[0.5em] font-bold mb-4 uppercase">未来への聖なる神託</h4>
                                                <p className="text-lg md:text-xl text-indigo-100 font-light italic leading-relaxed">
                                                    {result.comp.oracle}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <button 
                                    onClick={() => setView('input')} 
                                    className="w-full py-8 text-[11px] tracking-[1em] text-gold-accent/40 hover:text-gold-accent transition-all duration-700 cinzel font-bold">
                                    ― RETURN TO THE ETERNITY ―
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
